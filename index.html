<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1B1F23" />
    <meta name="description" content="וורדעל — משחק ניחוש מילים בעברית, בלי מילה יומית קבועה. מאגר ענק של מילים, כל אחד בוחר את המילה הבאה." />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>וורדעל</title>
    <script>
      // Apply the stored language before first paint, so an English player
      // doesn't see a frame of RTL layout before React mounts. useLanguage()
      // is still the source of truth; this only pre-seeds the attributes.
      (function () {
        try {
          var stored = localStorage.getItem("wordel:lang");
          if (stored === "en") {
            document.documentElement.lang = "en";
            document.documentElement.dir = "ltr";
            document.title = "Wordel";
          }
        } catch (e) {
          /* private mode / storage disabled — fall back to the Hebrew default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
